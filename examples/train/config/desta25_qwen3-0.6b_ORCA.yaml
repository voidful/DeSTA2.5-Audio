hydra:
  run:
    dir: ${exp_dir}


project: desta25_qwen3_0.6b_orca_r1
name: desta25_qwen3_0.6b_orca_r1
exp_dir: ???

resume_from_checkpoint: null
init_from_pretrained_weights: null

ptl_module: default

wandb:
  project: desta25_qwen3_0.6b_orca_r1
  log_model: all

trainer:
  devices: [0,1,2,3,] # 0 for CPU, or list of the GPUs to use e.g. [0, 1] or [0]
  num_nodes: 1
  max_epochs: 5
  max_steps: -1 # precedence over max_epochs
  accumulate_grad_batches: 1 # accumulates grads every k batches
  gradient_clip_val: 1.0
  precision: "bf16-mixed" #16 # should be set to 16 for O1 and O2 to enable the AMP.
  accelerator: gpu
  log_every_n_steps: 10  # interval of logging.
  val_check_interval: 0.5  # set to 0.25 to check 4 times per epoch, or an int for number of iterations
  num_sanity_val_steps: 0 # number of steps to perform validation steps for sanity check the validation process before starting the training, setting to 0 disables it
  enable_checkpointing: True


model:
  llm:
    model_id: Qwen/Qwen3-0.6B
    freeze: True

  encoder:
    model_id: openai/whisper-large-v3
    freeze: True

  connector:
    mode: orca_r1  # Use ORCA-R1 connector
    prompt_size: 64    # Not used in orca_r1 mode, kept for compatibility
    num_hidden_layers: 6
    use_flash_attention: true  # Use SDPA for faster attention

  # ORCA-R1 specific configuration
  orca_r1:
    # Group-wise Orthogonal Q-Former settings
    num_groups: 8  # Number of semantic groups (emotion, speaker, prosody, etc.)
    queries_per_group: 8  # Queries per group (total = 64 tokens)
    
    # Loss weights
    inter_group_weight: 0.1  # Push group centroids apart (orthogonality)
    intra_group_weight: 0.01  # Light diversity within groups
    
    # Acoustic-Contrastive Decoding (inference)
    acd_alpha: 0.5  # Contrast strength: logits = full + alpha * (full - blind)

  # Qwen3 使用 <|video_pad|> 作为 placeholder token (已在词表中)
  placeholder_token: "<|video_pad|>"
  audio_locator: "<|AUDIO|>" # newly created token

  generation_kwargs:
    max_new_tokens: 512
    do_sample: False
    temperature: 1
    top_p: 1

optim:
  name: adafactor  # Memory-efficient optimizer
  lr: 1e-4
  weight_decay: 0  # Required by training script
  scale_parameter: false
  relative_step: false
  warmup_init: false

  sched:
    warmup_steps: 5000
