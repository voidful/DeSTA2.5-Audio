##############################################################################
# Ablation Exp 0: Baseline (standard DeSTA Q-Former)
#
# This is the controlled DeSTA baseline for component ablation:
#   - Standard Q-Former connector
#   - No groupwise orthogonality
#   - No stochastic perturbation encoding
#   - No Acoustic-Contrastive Preference / Modality-DPO
#   - No ASR dropout
##############################################################################
hydra:
  run:
    dir: ${exp_dir}


project: desta25_ablation
name: ablation_0_baseline_qformer
exp_dir: ???

resume_from_checkpoint: null
init_from_pretrained_weights: null

ptl_module: default

wandb:
  project: desta25_ablation
  log_model: all

trainer:
  devices: [0,1,2,3]
  num_nodes: 1
  max_epochs: 5
  max_steps: -1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "bf16-mixed"
  accelerator: gpu
  log_every_n_steps: 10
  val_check_interval: 0.5
  num_sanity_val_steps: 0
  enable_checkpointing: True


model:
  llm:
    model_id: Qwen/Qwen3-4B-Instruct-2507
    freeze: True

  encoder:
    model_id: openai/whisper-large-v3
    freeze: True

  connector:
    mode: qformer_1
    prompt_size: 64
    num_hidden_layers: 6
    use_flash_attention: true

  # Ignored by qformer_1. Kept only so the ablation YAMLs share the same shape.
  orca_desta:
    num_groups: 8
    queries_per_group: 8
    inter_group_weight: 0.0
    intra_group_weight: 0.0

  # Component 2: Stochastic Perturbation Encoding — DISABLED
  variational_grouping:
    enabled: false

  # Component 3: Acoustic-Contrastive Preference — DISABLED
  modality_dpo:
    enabled: false

  # ASR Dropout — DISABLED
  asr_dropout:
    prob: 0.0

  placeholder_token: "<|video_pad|>"
  audio_locator: "<|AUDIO|>"

  generation_kwargs:
    max_new_tokens: 512
    do_sample: False
    temperature: 1
    top_p: 1

optim:
  name: adafactor
  lr: 1e-4
  weight_decay: 0
  scale_parameter: false
  relative_step: false
  warmup_init: false

  sched:
    warmup_steps: 5000
