hydra:
  run:
    dir: ${exp_dir}


project: desta25_qwen3_4b_struct_orca
name: desta25_qwen3_4b_struct_orca
exp_dir: ???

resume_from_checkpoint: null
init_from_pretrained_weights: null

ptl_module: default

wandb:
  project: desta25_qwen3_4b_struct_orca
  log_model: all

trainer:
  devices: [0,1,2,3,]
  num_nodes: 1
  max_epochs: 5
  max_steps: -1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "bf16-mixed"
  accelerator: gpu
  log_every_n_steps: 10
  val_check_interval: 0.5
  num_sanity_val_steps: 0
  enable_checkpointing: True


model:
  llm:
    model_id: Qwen/Qwen3-4B-Instruct-2507
    freeze: True

  encoder:
    model_id: openai/whisper-large-v3
    freeze: True

  connector:
    mode: struct_orca
    prompt_size: 64
    num_hidden_layers: 6
    use_flash_attention: true  # Use SDPA for faster attention

  struct_orca:
    num_groups: 8
    queries_per_group: 8
    inter_group_weight: 0.1
    intra_group_weight: 0.01
    iv_weight: 0.1
    acd_alpha: 0.5

  placeholder_token: "<|video_pad|>"
  audio_locator: "<|AUDIO|>"

  generation_kwargs:
    max_new_tokens: 512
    do_sample: False
    temperature: 1
    top_p: 1

optim:
  name: adafactor  # Memory-efficient optimizer
  lr: 1e-4
  weight_decay: 0  # Required by training script
  scale_parameter: false
  relative_step: false
  warmup_init: false

  sched:
    warmup_steps: 5000
