##############################################################################
# Ablation Exp 1: + Groupwise Orthogonality (Component 1)
#
# Adds inter-group and intra-group orthogonality losses on top of baseline.
# This reduces query redundancy by encouraging different groups to encode
# complementary information.
#
# Paper reference: Section 4.2 (Groupwise Orthogonal Connector)
# - L_inter: penalizes similarity between group centroids
# - L_intra: keeps within-group token similarity near moderate target
##############################################################################
hydra:
  run:
    dir: ${exp_dir}


project: desta25_ablation
name: ablation_1_groupwise_ortho
exp_dir: ???

resume_from_checkpoint: null
init_from_pretrained_weights: null

ptl_module: default

wandb:
  project: desta25_ablation
  log_model: all

trainer:
  devices: [0,1,2,3]
  num_nodes: 1
  max_epochs: 5
  max_steps: -1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "bf16-mixed"
  accelerator: gpu
  log_every_n_steps: 10
  val_check_interval: 0.5
  num_sanity_val_steps: 0
  enable_checkpointing: True


model:
  llm:
    model_id: Qwen/Qwen3-4B-Instruct-2507
    freeze: True

  encoder:
    model_id: openai/whisper-large-v3
    freeze: True

  connector:
    mode: orca_desta
    prompt_size: 64
    num_hidden_layers: 6
    use_flash_attention: true

  # ORCA connector with Groupwise Orthogonality ENABLED
  orca_desta:
    num_groups: 8
    queries_per_group: 8
    inter_group_weight: 0.1    # ENABLED: push group centroids apart
    intra_group_weight: 0.01   # ENABLED: light diversity within groups

  # Component 2: Stochastic Perturbation Encoding — DISABLED
  variational_grouping:
    enabled: false

  # Component 3: Acoustic-Contrastive Preference — DISABLED
  modality_dpo:
    enabled: false

  # ASR Dropout — DISABLED
  asr_dropout:
    prob: 0.0

  placeholder_token: "<|video_pad|>"
  audio_locator: "<|AUDIO|>"

  generation_kwargs:
    max_new_tokens: 512
    do_sample: False
    temperature: 1
    top_p: 1

optim:
  name: adafactor
  lr: 1e-4
  weight_decay: 0
  scale_parameter: false
  relative_step: false
  warmup_init: false

  sched:
    warmup_steps: 5000
