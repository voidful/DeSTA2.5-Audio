## Ablation dataset config for Qwen3-4B ORCA component study
## Uses a sampled subset (~5k per source) for faster iteration
train_ds:
  data_root: "/work/voidful2nlp/desta"
  manifest_filepaths:
    - "/work/voidful2nlp/desta/qwen3_4b_desta_sampled.jsonl"

  batch_sampler: null
  max_seq_length: 300
  batch_size: 12  # Reduced for ablation experiments (4 GPUs)
  shuffle: True
  pin_memory: True
  num_workers: 4
  drop_last: True
  return_seed: False
  answer_shift: 0

validation_ds:
  batch_sampler: null
  data_root: "/work/voidful2nlp/desta"
  manifest_filepaths:
    - "/work/voidful2nlp/desta/val_qwen3_4b_desta_fixed.jsonl"
  max_seq_length: 512
  batch_size: 2
  shuffle: False
  pin_memory: True
  num_workers: 0
  drop_last: True
  return_seed: False
